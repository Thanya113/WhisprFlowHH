<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#090b12" />
  <g filter="url(#glow)">
    <rect x="20" y="42" width="8" height="16" rx="4" fill="url(#grad)" />
    <rect x="33" y="30" width="8" height="40" rx="4" fill="url(#grad)" />
    <rect x="46" y="18" width="8" height="64" rx="4" fill="url(#grad)" />
    <rect x="59" y="26" width="8" height="48" rx="4" fill="url(#grad)" />
    <rect x="72" y="38" width="8" height="24" rx="4" fill="url(#grad)" />
  </g>
</svg>